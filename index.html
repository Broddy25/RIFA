    <script>
      (function() {
        // Prevent extension security errors in iframes
        try {
          var suppressError = function(msg, src) {
            var m = String(msg || '');
            var s = String(src || '');
            return (
              s.indexOf('chrome-extension://') !== -1 ||
              m.indexOf('cross-origin frame') !== -1 ||
              m.indexOf('Location') !== -1 ||
              m.indexOf('SecurityError') !== -1
            );
          };

          window.addEventListener('error', function(event) {
            if (suppressError(event.message, event.filename) || (event.error && suppressError(event.error.message, ''))) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && suppressError(event.reason.message || event.reason, '')) {
              event.preventDefault();
            }
          });

          var prevOnError = window.onerror;
          window.onerror = function(message, source) {
            if (suppressError(message, source)) return true;
            if (prevOnError) return prevOnError.apply(this, arguments);
          };
        } catch (e) {}

        // Safe top / parent proxies to avoid cross-origin Location access
        try {
          Object.defineProperty(window, 'top', {
            configurable: true,
            get: function() { return window; }
          });
        } catch (e) {}
        try {
          Object.defineProperty(window, 'parent', {
            configurable: true,
            get: function() { return window; }
          });
        } catch (e) {}

        // Ensure window.fetch is writable and configurable
        try {
          var _fetch = window.fetch;
          if (window.Window && window.Window.prototype) {
            var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (desc && desc.get && !desc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: desc.get,
                set: function(val) {
                  _fetch = val;
                }
              });
            }
          }
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
        } catch (e) {}
      })();
    </script>
